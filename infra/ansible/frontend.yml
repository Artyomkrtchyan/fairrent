---
- name: Configure autonomous frontend and Nginx startup
  hosts: "{{ target_hosts | default('backend') }}"
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    aws_region: eu-central-1
    ecr_registry: 566663271715.dkr.ecr.eu-central-1.amazonaws.com
    frontend_image: "{{ ecr_registry }}/fairrent-frontend:demo-v2"
    frontend_start: true

  tasks:
    - name: Verify existing AWS CLI installation
      ansible.builtin.command: /usr/local/bin/aws --version
      changed_when: false

    - name: Check that backend service was installed first
      ansible.builtin.stat:
        path: /etc/systemd/system/fairrent-backend.service
      register: backend_unit

    - name: Require the backend service definition
      ansible.builtin.assert:
        that: backend_unit.stat.exists
        fail_msg: Run backend.yml on this host before installing frontend.

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Create frontend configuration directory
      ansible.builtin.file:
        path: /etc/fairrent
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Write nonsecret frontend settings
      ansible.builtin.copy:
        dest: /etc/fairrent/frontend.json
        owner: root
        group: root
        mode: "0640"
        content: >-
          {{ {'aws_region': aws_region, 'ecr_registry': ecr_registry,
              'frontend_image': frontend_image} | to_nice_json }}
      notify: Restart FairRent frontend

    - name: Install frontend bootstrap script
      ansible.builtin.copy:
        src: files/fairrent-frontend-start.py
        dest: /usr/local/sbin/fairrent-frontend-start.py
        owner: root
        group: root
        mode: "0750"
        validate: /usr/bin/python3 -m py_compile %s
      notify: Restart FairRent frontend

    - name: Install frontend systemd service
      ansible.builtin.template:
        src: templates/fairrent-frontend.service.j2
        dest: /etc/systemd/system/fairrent-frontend.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart FairRent frontend

    - name: Apply frontend service changes
      ansible.builtin.meta: flush_handlers

    - name: Enable frontend startup on boot
      ansible.builtin.systemd_service:
        name: fairrent-frontend
        enabled: true
        daemon_reload: true
        state: "{{ 'started' if (frontend_start | bool) else 'stopped' }}"

    - name: Check frontend and API through Nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1/{{ item }}"
        status_code: 200
        timeout: 10
      loop:
        - ""
        - health
        - ready
        - api/v1/listings
      register: frontend_check
      until: frontend_check.status | default(0) == 200
      retries: 36
      delay: 10
      when: frontend_start | bool

  handlers:
    - name: Restart FairRent frontend
      ansible.builtin.systemd_service:
        name: fairrent-frontend
        daemon_reload: true
        state: restarted
      when: frontend_start | bool
