# The frontend container shares the EC2 host network. Backend publishes only
# 127.0.0.1:8000; ALB connects to this Nginx on port 80.
upstream fairrent_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Preserve HTTPS information supplied by the ALB, which terminates TLS.
map $http_x_forwarded_proto $fairrent_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    # Defining local types replaces inheritance, so retain the full standard
    # table before adding Vite's .mjs worker extension.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fairrent_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_intercept_errors off;

    # No URI suffix on proxy_pass: preserve /api/v1/... and its query string.
    location ^~ /api/ {
        proxy_pass http://fairrent_backend;
    }

    location = /api {
        proxy_pass http://fairrent_backend;
    }

    # These endpoints must reach FastAPI, including 503 readiness failures.
    location ~ ^/(health|ready|openapi\.json|docs|redoc)$ {
        proxy_pass http://fairrent_backend;
    }

    # Fingerprinted Vite assets may be cached; nonexistent assets must be 404,
    # rather than index.html with a misleading JavaScript MIME type.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Router routes such as /analytics or /listings/<id> resolve to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
