name: Project task
description: A task with deliverables and acceptance criteria
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and scope
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Data / DB
        - ML / Ontology
        - Backend
        - Frontend
        - Infra
        - Docs / QA
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverables and acceptance criteria
      description: Describe the expected result and how to verify completion
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues and required contracts
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
