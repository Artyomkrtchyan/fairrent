name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          curl -fL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan repository for secrets
        run: /tmp/gitleaks git . --redact
      - name: Verify scanner detects a harmless synthetic fixture
        shell: bash
        run: |
          printf '%s\n' '[[rules]]' 'id = "fairrent-synthetic"' 'description = "Test-only fixture"' "regex = '''FAIRRENT_TEST_SECRET_[A-Z0-9]+'''" > "$RUNNER_TEMP/gitleaks-fixture.toml"
          printf '%s\n' 'FAIRRENT_TEST_SECRET_12345' > "$RUNNER_TEMP/gitleaks-fixture.txt"
          set +e
          /tmp/gitleaks dir "$RUNNER_TEMP/gitleaks-fixture.txt" --config "$RUNNER_TEMP/gitleaks-fixture.toml" --redact
          result=$?
          set -e
          test "$result" -eq 1

  python-dependency-scan:
    name: Python audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend-runtime
            requirements: backend/requirements.txt
          - component: backend-development
            requirements: backend/requirements-dev.txt
          - component: ml-training
            requirements: ml/requirements-train.txt
          - component: contracts
            requirements: contracts/requirements.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit dependencies
        run: python -m pip_audit -r "${{ matrix.requirements }}"

  frontend-dependency-scan:
    name: Frontend dependency scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  backend-container-scan:
    name: Backend Docker security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build backend Docker image
        run: docker build -t fairrent-backend:security ./backend
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fairrent-backend:security
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  frontend-container-scan:
    name: Frontend Docker security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t fairrent-frontend:security .
      - name: Smoke-test frontend static response
        shell: bash
        run: |
          docker run -d --name fairrent-frontend-smoke -p 127.0.0.1:18080:80 fairrent-frontend:security
          trap 'docker rm -f fairrent-frontend-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:18080/
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fairrent-frontend:security
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
