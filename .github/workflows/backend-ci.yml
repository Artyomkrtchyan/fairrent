name: Component CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: c03-test-only
          POSTGRES_DB: c03_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      C03_TEST_DATABASE_URL: postgresql://postgres:c03-test-only@127.0.0.1:5432/c03_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:c03-test-only@127.0.0.1:5432/c03_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            ml/requirements.txt
            ml/requirements-train.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r ml/requirements-train.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Verify B04 training dependencies
        run: python -c "import catboost; from ml import train_compare"

      - name: Run backend, data pipeline and ML tests
        run: python -m pytest backend/tests data_pipeline ml/tests -v

      - name: Smoke-test B04 on synthetic data
        run: python -m ml.train_compare --synthetic --version ci-smoke --output-dir "${{ runner.temp }}/b04"

  docker-build:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --tag fairrent-api:ci-${{ github.sha }} --file backend/Dockerfile .

  contract-validation:
    name: Contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: contracts/requirements.txt

      - name: Install contract dependencies
        run: python -m pip install -r contracts/requirements.txt

      - name: Validate committed contracts
        run: python contracts/validate.py

      - name: Check generated files are current
        run: |
          python contracts/generate.py
          git diff --exit-code -- contracts/openapi.json contracts/fixtures.json

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
