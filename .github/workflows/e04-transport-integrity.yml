name: E04 Transport and Integrity Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    name: Check FairRent HTTPS certificate and redirect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check certificate chain and hostname
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 20 openssl s_client -connect fairrent.online:443 -servername fairrent.online \
            -verify_hostname fairrent.online -verify_return_error \
            </dev/null > "$RUNNER_TEMP/tls-check.txt" 2>&1; then
            tail -n 25 "$RUNNER_TEMP/tls-check.txt"
            echo "TLS handshake or certificate verification failed; owner must investigate." >&2
            exit 1
          fi
          openssl x509 -in <(openssl s_client -connect fairrent.online:443 \
            -servername fairrent.online </dev/null 2>/dev/null) \
            -noout -subject -issuer -dates
      - name: Verify HTTP redirects to HTTPS
        shell: bash
        run: |
          set -euo pipefail
          target=$(curl --fail --silent --show-error --location \
            --max-time 25 --output /dev/null --write-out '%{url_effective}' \
            http://fairrent.online/)
          case "$target" in
            https://fairrent.online|https://fairrent.online/*)
              echo "HTTP redirect target is HTTPS on fairrent.online"
              ;;
            *) echo "Unexpected HTTP redirect target: $target" >&2; exit 1 ;;
          esac
      - name: Check initial HTML for obvious insecure resource references
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 \
            https://fairrent.online/ --output "$RUNNER_TEMP/home.html"
          if grep -Eiq '<(script|img|link)[^>]+(src|href)=[^>]*http://' "$RUNNER_TEMP/home.html"; then
            echo "Initial HTML includes an insecure HTTP resource" >&2
            exit 1
          fi
          echo "No obvious insecure script/image/stylesheet URL in initial HTML."
          echo "This does not replace browser mixed-content testing."

  integrity-negative-control:
    name: Reject tampered synthetic artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify digest success and fail-closed tampering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e04"
          printf '%s' 'synthetic model v1' > "$RUNNER_TEMP/e04/model.bin"
          (cd "$RUNNER_TEMP/e04" && sha256sum model.bin > manifest.sha256)
          (cd "$RUNNER_TEMP/e04" && sha256sum --check manifest.sha256)
          printf '%s' 'tampered' >> "$RUNNER_TEMP/e04/model.bin"
          if (cd "$RUNNER_TEMP/e04" && sha256sum --check manifest.sha256); then
            echo "Tampered artifact was incorrectly accepted" >&2
            exit 1
          fi
          echo "Tampered synthetic artifact correctly rejected."
